<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><style>
.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ccc;padding:8px;cursor:pointer;width:700px}
</style></head><body>
<!-- A destination's trades list (fictitious): tabs, rows naming the partner, with Accept/Decline buttons inside the row. -->
<header><a href="https://example.invalid/users/9/profile">sigma2</a></header>
<div><button id="t-in">Recebidas</button><button id="t-out">Enviadas</button></div>
<div id="list"></div>
<div id="detail"></div>
<aside><div>Bate-papo</div><a href="https://example.invalid/chat/Beta">Beta</a></aside>
<script>
window.clicks=[];window.accepted=false;window.declined=false;
const LINK = new URLSearchParams(location.search).get('mode')==='link';
function rows(kind){const l=document.getElementById('list');l.innerHTML='';
  const data = kind==='in' ? [['Beta','@fonte_beta','15/11'],['Outra Pessoa','@outra','14/11'],['Beta','@fonte_beta','10/11']] : [['Fulano','@fulano','12/11']];
  data.forEach(([d,u,dt],i)=>{const r=document.createElement('div');r.className='row';
    r.innerHTML='<img width=40 height=40><div><div class="name">'+d+'</div><div class="user">'+u+'</div></div><span>'+dt+'</span>'+
      (LINK && i===0 ? '<a class="open" href="https://www.roblox.com/trades/987654321">ver</a>' : '')+
      '<button class="acc">Aceitar</button><button class="dec">Recusar</button>';
    r.onclick=()=>{window.clicks.push('row:'+d+':'+i);document.getElementById('detail').textContent='DETALHE '+d+' '+i};
    r.querySelector('.acc').onclick=e=>{e.stopPropagation();window.accepted=true};
    r.querySelector('.dec').onclick=e=>{e.stopPropagation();window.declined=true};
    l.appendChild(r)})}
document.getElementById('t-in').onclick=()=>{window.clicks.push('tab:in');rows('in')};
document.getElementById('t-out').onclick=()=>rows('out');
setTimeout(()=>rows('out'),700); // opens on "Enviadas": the script must switch to "Recebidas"
</script></body></html>
