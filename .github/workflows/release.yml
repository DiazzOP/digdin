# Builds a release from the source in this repository when a version tag (v1.2.3) is pushed.
# The app's updater (⚙ → Atualizações) installs RbxSwitcher.exe only if it matches RbxSwitcher.exe.sha256.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($tag -ne $version) { throw "Tag v$tag does not match <Version>$version</Version>" }

      - name: Publish
        run: >
          dotnet publish src/RbxSwitcher.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:AllowedReferenceRelatedFileExtensions=none -o dist/RbxSwitcher

      - name: Hash and package
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RbxSwitcher/RbxSwitcher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RbxSwitcher.exe" | Out-File -Encoding ascii -NoNewline dist/RbxSwitcher.exe.sha256
          Compress-Archive -Path dist/RbxSwitcher -DestinationPath "dist/RbxSwitcher-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/RbxSwitcher/RbxSwitcher.exe `
            dist/RbxSwitcher.exe.sha256 `
            "dist/RbxSwitcher-${{ github.ref_name }}-win-x64.zip" `
            --title "RbxSwitcher ${{ github.ref_name }}" --generate-notes
